<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Metropolis — Inventory</title>

        <link rel="stylesheet" href="css/theme.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/pages.css" />
    </head>
    <body>
        <header class="topbar">
            <a class="brand" href="index.html">
                <span class="brand__mark" data-icon="house"></span>
                <span class="brand__name">Metropolis</span>
            </a>

            <nav class="nav" aria-label="Main">
                <a class="nav__link" href="index.html" data-nav="index.html">
                    <span class="nav__icon" data-icon="place"></span>
                    <span class="nav__label">Market Day</span>
                </a>
                <a class="nav__link" href="village.html" data-nav="village.html">
                    <span class="nav__icon" data-icon="map"></span>
                    <span class="nav__label">Village</span>
                </a>
                <a class="nav__link" href="buildings.html" data-nav="buildings.html">
                    <span class="nav__icon" data-icon="house"></span>
                    <span class="nav__label">Buildings</span>
                </a>
                <a class="nav__link" href="inventory.html" data-nav="inventory.html">
                    <span class="nav__icon" data-icon="chest"></span>
                    <span class="nav__label">Inventory</span>
                </a>
                <a class="nav__link" href="city.html" data-nav="city.html">
                    <span class="nav__icon" data-icon="city"></span>
                    <span class="nav__label">City</span>
                </a>
            </nav>

            <div class="hud" id="hud" aria-label="Resources"></div>
        </header>

        <main class="page">
            <div class="page__head">
                <h1 class="page__title">Inventory</h1>
                <p class="page__hint">
                    What the village is holding. Build a Storehouse to hold more.
                </p>
            </div>

            <section class="cards" id="inventoryCards"></section>

            <section class="panel">
                <h2 class="panel__title">The map right now</h2>
                <dl class="stats" id="villageStats"></dl>
            </section>

            <section class="panel panel--quiet">
                <h2 class="panel__title">Save</h2>
                <p class="muted">
                    Progress is stored in this browser, and buildings keep
                    filling up while you are away.
                </p>
                <button class="btn btn--ghost" id="resetBtn" type="button">
                    <span data-icon="close"></span>
                    Start a new village
                </button>
            </section>
        </main>

        <div class="notice-host" id="noticeHost" aria-live="polite"></div>

        <script src="js/core/config.js"></script>
        <script src="js/core/events.js"></script>
        <script src="js/core/storage.js"></script>
        <script src="js/core/state.js"></script>
        <script src="js/core/clock.js"></script>
        <script src="js/core/boot.js"></script>

        <script src="js/data/terrain.js"></script>
        <script src="js/data/resources.js"></script>
        <script src="js/data/buildings.js"></script>
        <script src="js/data/stages.js"></script>

        <script src="js/systems/terrainmap.js"></script>
        <script src="js/systems/grid.js"></script>
        <script src="js/systems/capacity.js"></script>
        <script src="js/systems/inventory.js"></script>
        <script src="js/systems/comfort.js"></script>
        <script src="js/systems/production.js"></script>
        <script src="js/systems/spawner.js"></script>
        <script src="js/systems/harvest.js"></script>
        <script src="js/systems/construction.js"></script>
        <script src="js/systems/expansion.js"></script>

        <script src="js/ui/icons.js"></script>
        <script src="js/ui/nav.js"></script>
        <script src="js/ui/hud.js"></script>
        <script src="js/ui/toast.js"></script>
        <script src="js/ui/inventoryview.js"></script>

        <script src="js/pages/inventory.js"></script>
    </body>
</html>
